<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RETRO VAULT 57 — Classic Arcade Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🕹️ RETRO VAULT 57</h1>
  <div class="subtitle">57 RETRO 8-BIT ARCADE CLASSICS</div>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search game (e.g. Snake, Bomber...)" />
    <div class="filters" id="filterBar">
      <button class="filter-btn active" data-cat="ALL">All (57)</button>
      <button class="filter-btn" data-cat="ARCADE">Arcade</button>
      <button class="filter-btn" data-cat="SHOOTER">Shooter</button>
      <button class="filter-btn" data-cat="PUZZLE">Puzzle</button>
      <button class="filter-btn" data-cat="REFLEX">Reflex</button>
      <button class="filter-btn" data-cat="CLASSIC">Classic</button>
      <button class="filter-btn" data-cat="FAV">❤️ Favorites</button>
    </div>
  </div>
</header>

<div class="stats-bar">
  <span id="countLabel">Showing: 57 games</span>
  <span>8-Bit Sound: ON 🔊</span>
</div>

<main class="grid" id="gameGrid"></main>

<!-- Arcade Cabinet Modal -->
<div class="modal" id="gameModal">
  <div class="cabinet">
    <div class="cab-header">
      <span class="cab-title" id="modalTitle">GAME TITLE</span>
      <button class="btn-close" id="closeModalBtn">✖ QUIT</button>
    </div>
    <div class="hud">
      <span>SCORE: <strong id="scoreVal" style="color:var(--neon-cyan)">0</strong></span>
      <span>HIGH SCORE: <strong id="bestVal" style="color:var(--neon-yellow)">0</strong></span>
      <span id="statusVal" style="color:var(--neon-green)">READY</span>
    </div>
    <canvas id="gameCanvas" width="420" height="420"></canvas>
    <div class="controls-hint" id="hintText">Use Arrow keys / WASD or touch/drag on screen to play.</div>
    <div class="cab-actions">
      <button class="btn-action" id="restartBtn">↻ RESTART</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="arcade.js"></script>
</body>
</html>
